name: Auto Inject Language
on: [push]
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Inject auto translate script
        run: |
          for file in *.html; do
            if ! grep -q "auto-translate.js" "$file"; then
              sed -i 's|</body>|<div id="google_translate_element" style="display:none"></div><script src="/auto-translate.js"></script><script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script><style>.goog-te-banner-frame.skiptranslate{display:none!important}body{top:0!important}</style></body>|' "$file"
            fi
          done
          git config --global user.email "ayush@nexora.com"
          git config --global user.name "Ayush"
          git add .
          git diff --staged --quiet || git commit -m "Auto language injected"
          git push
