<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA Tools - Professional Calculators</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a1931;overflow-x:hidden;color:white}
.nav{width:94%;max-width:1300px;margin:18px auto;background:#0f2342;border:1px solid #1a365f;border-radius:16px;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:24px;color:white;display:flex;align-items:center;gap:10px}
.logo-icon{width:38px;height:38px;background:#162f5e;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid #2a4a7a}
.nav-links{color:#9ab0d0;display:flex;gap:26px;font-size:14px;font-weight:500}
.nav-links b{color:white}
.btns{display:flex;gap:10px;align-items:center}
.btn{padding:9px 18px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-dark{background:#162f5e;color:#a8b9d6;border:1px solid #2a4a7a}
.btn-blue{background:#2563eb;color:white}
.hero{text-align:center;padding:50px 20px 10px}
.hero small{color:#7ea0d4;letter-spacing:3px;font-size:12px;font-weight:700}
.hero h1{font-size:42px;font-weight:800;margin:14px 0;color:white}
.hero p{color:#8fa6c8;font-size:15px}

.wrap{width:100%;height:560px;display:flex;align-items:center;overflow:hidden;position:relative;perspective:1500px}
.carousel{display:flex;align-items:center;will-change:transform;transition:transform 1s cubic-bezier(0.22,1,0.36,1)}
.card{
min-width:380px;max-width:380px;height:500px;background:white;border-radius:22px;padding:26px;
transform:scale(0.82) rotateY(18deg);opacity:0.45;filter:blur(3px);
transition:all 1s cubic-bezier(0.22,1,0.36,1);box-shadow:0 10px 40px rgba(0,0,0,0.4);
color:black;flex-shrink:0;margin:0 12px;
}
.card.active{transform:scale(1.08) rotateY(0deg);opacity:1;filter:blur(0);z-index:5;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.card-icon{width:54px;height:54px;background:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:white}
.card-top h2{font-size:22px;color:black;font-weight:800;line-height:1}
.card-top span{font-size:13px;color:#666;display:block;margin-top:4px;font-weight:500}
.field{margin-top:18px;text-align:left}
.field label{font-size:14px;color:#444;font-weight:600;display:block;margin-bottom:6px}
.input-row{display:flex}
.input-row input{flex:1;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px 0 0 10px;outline:none;font-size:16px;font-weight:600;color:black}
.unit{padding:12px 18px;background:#d1d5db;border-radius:0 10px 10px 0;color:#555;font-weight:700;border:1px solid #d1d5db;border-left:0}
.calc-btn{width:70%;margin:18px auto 0;display:block;padding:12px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.result-box{margin-top:16px;background:#dbeafe;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left}
.result-box.tick{width:32px;height:32px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;flex-shrink:0}
.result-box b{color:black;font-size:15px}
.result-box p{color:#444;font-size:12px;margin-top:2px}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0 30px}
.dot{width:10px;height:10px;background:#1e3a6b;border-radius:50%;transition:0.4s;cursor:pointer}
.dot.active{background:#3b82f6;width:26px}
@media(max-width:600px){
.card{min-width:88vw;max-width:88vw}
.hero h1{font-size:28px}
.nav-links{display:none}
}
</style>
</head>
<body>

<div class="nav">
<div class="logo"><div class="logo-icon">🧮</div> NEXORA Tools</div>
<div class="nav-links"><span>Home</span> <b>Calculators</b> <span>About</span> <span>Contact</span></div>
<div class="btns"><button class="btn btn-dark">Sign In</button><button class="btn btn-blue">Start Free</button></div>
</div>

<div class="hero">
<small>CALCULATORS</small>
<h1>Everything you need, in one place</h1>
<p>Choose a calculator to get started — fast, accurate, and easy to use.</p>
</div>

<div class="wrap"><div class="carousel" id="carousel"></div></div>
<div class="dots" id="dots"></div>

<script>
const tools=[
{id:"age",title:"Age Calculator",desc:"Calculate age from date of birth",icon:"📅",fields:[{label:"Date of Birth",type:"date",val:"1995-06-15",unit:""}],btn:"Calculate Age",calc:(v)=>{let dob=new Date(v[0]);let diff=Date.now()-dob;let age=Math.floor(diff/(1000*60*60*24*365.25));return `Your Age is ${age} Years — Adult`;}},
{id:"bmi",title:"BMI Calculator",desc:"Calculate your Body Mass Index",icon:"🧍",fields:[{label:"Height (cm)",val:"170",unit:"cm"},{label:"Weight (kg)",val:"65",unit:"kg"}],btn:"Calculate BMI",calc:(v)=>{let h=v[0]/100;let bmi=(v[1]/(h*h)).toFixed(1);let s=bmi<18.5?"Underweight":bmi<24.9?"Healthy":bmi<29.9?"Overweight":"Obese";return `Your BMI is ${bmi} — ${s}`;}},
{id:"emi",title:"Loan EMI Calculator",desc:"Estimate your monthly loan payment",icon:"🏦",fields:[{label:"Loan Amount (₹)",val:"500000",unit:"₹"},{label:"Interest Rate (%)",val:"8.5",unit:"%"}],btn:"Calculate EMI",calc:(v)=>{let p=v[0],r=v[1]/12/100,n=60;let emi=(p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)).toFixed(0);return `EMI is ₹${emi}/month — 5 Years`;}},
{id:"discount",title:"Discount Calculator",desc:"Find final price after discount",icon:"🏷️",fields:[{label:"Price",val:"1000",unit:"₹"},{label:"Discount",val:"20",unit:"%"}],btn:"Calculate",calc:(v)=>{let final=v[0]-v[0]*v[1]/100;return `Final Price ₹${final} — You save ₹${v[0]*v[1]/100}`;}},
{id:"qr",title:"QR Generator",desc:"Generate QR for link or text",icon:"🔳",fields:[{label:"Text / Link",val:"nexora.com",unit:""}],btn:"Generate QR",calc:(v)=>{return `QR Generated for ${v[0]} — Ready to Download`;}},
{id:"percent",title:"Percentage Calculator",desc:"Quick percentage calculations",icon:"%",fields:[{label:"Number",val:"500",unit:""},{label:"Percent",val:"15",unit:"%"}],btn:"Calculate %",calc:(v)=>{return `${v[1]}% of ${v[0]} is ${v[0]*v[1]/100}`;}},
];

const carousel=document.getElementById('carousel');
const dots=document.getElementById('dots');
let idx=1;

tools.forEach((t,i)=>{
let card=document.createElement('div');card.className='card';card.id='card-'+i;
let fieldsHTML=t.fields.map((f,j)=>`
<div class="field"><label>${f.label}</label>
<div class="input-row"><input id="inp-${i}-${j}" type="${f.type||'number'}" value="${f.val}"><div class="unit">${f.unit}</div></div>
</div>`).join('');
card.innerHTML=`
<div class="card-top"><div class="card-icon">${t.icon}</div><div><h2>${t.title}</h2><span>${t.desc}</span></div></div>
${fieldsHTML}
<button class="calc-btn" onclick="doCalc(${i})">${t.btn}</button>
<div class="result-box" id="res-${i}"><div class="tick">✓</div><div><b id="res-b-${i}">Enter values to calculate</b><p>Result will show here</p></div></div>`;
carousel.appendChild(card);
let dot=document.createElement('div');dot.className='dot';dot.onclick=()=>{idx=i;update()};dots.appendChild(dot);
});

function doCalc(i){
let t=tools[i];
let vals=t.fields.map((f,j)=>{let el=document.getElementById(`inp-${i}-${j}`);return el.type==='date'?el.value:parseFloat(el.value)||el.value});
let txt=t.calc(vals);
let b=document.getElementById(`res-b-${i}`);
if(b){b.innerHTML=txt.split(' — ')[0];b.nextElementSibling.innerText=txt.split(' — ')[1]||'Calculated successfully';}
}

function update(){
document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('active',i===idx));
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
let offset=-idx*404 + (window.innerWidth/2 - 190);
carousel.style.transform=`translateX(${offset}px)`;
}
update();
doCalc(1);
setInterval(()=>{idx=(idx+1)%tools.length;update();},3500);
window.addEventListener('resize',update);
</script>
</body>
</html>
