<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compressor | NEXORA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#09090b;font-family:Arial} .sz{border:1px solid #e5e7eb;background:#f9fafb} .sz.selected{background:#f97316;color:white;border-color:#f97316}</style>
</head>
<body class="min-h-screen px-3 py-7">
<div class="max-w-xl mx-auto">
<div class="text-center mb-6"><h1 class="text-white text-3xl font-extrabold">Video Compressor</h1><p class="text-gray-400 text-sm mt-2">Fast - No Engine Download</p></div>
<div class="bg-white rounded-3xl p-5 shadow-2xl">
<div id="dropArea" class="border-2 border-dashed border-orange-400 bg-orange-50 rounded-2xl p-7 text-center cursor-pointer">
<div class="text-5xl mb-3">🎬</div><h2 class="font-bold">Upload Your Video</h2><input id="fileInput" type="file" accept="video/*" hidden>
</div>
<div id="fileInfo" class="hidden mt-4 bg-gray-50 rounded-xl p-3"><p id="fileName" class="font-bold text-sm"></p><div class="flex justify-between text-xs mt-2"><span>Original</span><b id="originalSize"></b></div><div class="flex justify-between text-xs mt-1"><span>Duration</span><b id="durationText"></b></div></div>
<video id="originalVideo" class="hidden w-full rounded-xl mt-4 max-h-64" controls playsinline></video>
<canvas id="canvas" class="hidden"></canvas>
<div class="mt-6"><h2 class="font-bold">Choose Target Size</h2>
<div class="grid grid-cols-3 gap-3 mt-4">
<button class="sz selected rounded-xl py-4 font-bold" data-size="5">5 MB</button>
<button class="sz rounded-xl py-4 font-bold" data-size="10">10 MB</button>
<button class="sz rounded-xl py-4 font-bold" data-size="20">20 MB</button>
<button class="sz rounded-xl py-4 font-bold" data-size="30">30 MB</button>
<button class="sz rounded-xl py-4 font-bold" data-size="40">40 MB</button>
<button class="sz rounded-xl py-4 font-bold" data-size="50">50 MB</button>
</div></div>
<div id="progressBox" class="hidden mt-6"><div class="flex justify-between text-sm mb-2"><b id="statusText">Compressing...</b><b id="percentText" class="text-orange-600">0%</b></div><div class="h-3 bg-gray-200 rounded-full overflow-hidden"><div id="progressBar" class="bg-orange-500 h-full" style="width:0%"></div></div></div>
<button id="compressBtn" class="w-full mt-6 bg-orange-500 text-white font-bold py-4 rounded-xl">⚡ Compress Video to 5 MB</button>
<div id="resultBox" class="hidden mt-6 bg-green-50 border border-green-200 rounded-2xl p-4">
<h3 class="text-green-800 font-extrabold">✓ Complete!</h3>
<div class="grid grid-cols-2 gap-3 mt-3"><div class="bg-white rounded-xl p-3"><p class="text-xs">Original</p><p id="beforeSize" class="font-bold"></p></div><div class="bg-white rounded-xl p-3"><p class="text-xs">Final</p><p id="afterSize" class="font-bold text-green-700"></p></div></div>
<p id="resultMessage" class="text-sm text-green-800 mt-3"></p>
<video id="outputVideo" controls playsinline class="hidden w-full rounded-xl mt-3 max-h-64"></video>
<button id="downloadBtn" class="w-full mt-4 bg-green-600 text-white py-4 rounded-xl font-bold">⬇ Download MP4</button>
</div>
<div id="errorBox" class="hidden mt-4 bg-red-50 border p-3 rounded-xl text-sm text-red-700"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
let selectedFile=null, selectedSize=5, duration=0, outBlob=null, outURL=null, origURL=null;
function fmt(b){return (b/1048576).toFixed(2)+" MB";}
function fmtDur(s){const m=Math.floor(s/60), r=Math.floor(s%60); return `${m}m ${r}s`;}

function loadVideo(f){
 selectedFile=f; if(origURL) URL.revokeObjectURL(origURL); origURL=URL.createObjectURL(f);
 const v=$("originalVideo"); v.src=origURL; v.classList.remove("hidden");
 $("fileName").textContent=f.name; $("originalSize").textContent=fmt(f.size);
 $("fileInfo").classList.remove("hidden");
 v.onloadedmetadata=()=>{duration=v.duration; $("durationText").textContent=fmtDur(duration);};
}
$("dropArea").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>loadVideo(e.target.files[0]);
$("dropArea").ondragover=e=>{e.preventDefault();}; $("dropArea").ondrop=e=>{e.preventDefault(); loadVideo(e.dataTransfer.files[0]);};

document.querySelectorAll(".sz").forEach(b=>{
 b.onclick=()=>{document.querySelectorAll(".sz").forEach(x=>x.classList.remove("selected")); b.classList.add("selected"); selectedSize=Number(b.dataset.size); $("compressBtn").textContent=`⚡ Compress Video to ${selectedSize} MB`;}
});

$("compressBtn").onclick=async()=>{
 if(!selectedFile){$("errorBox").textContent="Upload video first"; $("errorBox").classList.remove("hidden"); return;}
 if(!duration){$("errorBox").textContent="Wait for video load"; $("errorBox").classList.remove("hidden"); return;}
 const targetBytes=selectedSize*1024*1024;
 if(selectedFile.size<=targetBytes){
  outBlob=selectedFile; showResult(`Already under ${selectedSize}MB`); return;
 }
 $("progressBox").classList.remove("hidden"); $("compressBtn").disabled=true; $("compressBtn").textContent="Compressing...";
 const v=$("originalVideo"), c=$("canvas"), ctx=c.getContext("2d");
 // Balanced scale - na zyada kam, na jyada
 let scale= selectedSize<=5?0.55 : selectedSize<=10?0.65 : selectedSize<=20?0.75 : 0.85;
 c.width=v.videoWidth*scale; c.height=v.videoHeight*scale;
 // Video + Audio dono stream me
 const canvasStream=c.captureStream(30);
 let audioTrack=null;
 try{
  const tempStream=v.captureStream ? v.captureStream() : v.mozCaptureStream();
  const audios=tempStream.getAudioTracks();
  if(audios.length>0) audioTrack=audios[0];
 }catch(e){}
 const mixed=new MediaStream();
 mixed.addTrack(canvasStream.getVideoTracks()[0]);
 if(audioTrack) mixed.addTrack(audioTrack);

 // Bitrate calculation - sahi wala
 let bitrate;
 if(selectedSize<=5) bitrate=900000;
 else if(selectedSize<=10) bitrate=1600000;
 else if(selectedSize<=20) bitrate=2800000;
 else bitrate=4000000;

 const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') ? 'video/mp4;codecs=avc1' : 'video/mp4';
 let chunks=[]; const rec=new MediaRecorder(mixed,{mimeType:mime,videoBitsPerSecond:bitrate});
 rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
 rec.onstop=()=>{
  outBlob=new Blob(chunks,{type:"video/mp4"});
  showResult(`Original ${fmt(selectedFile.size)} → Now ${fmt(outBlob.size)} | Audio OK | Speed Normal | Target ${selectedSize}MB`);
 };
 v.currentTime=0; v.muted=false;
 try{await v.play();}catch(e){}
 rec.start(100);
 const timer=setInterval(()=>{
  if(v.ended || v.paused){clearInterval(timer); rec.stop(); v.pause(); return;}
  ctx.drawImage(v,0,0,c.width,c.height);
  const p=Math.round((v.currentTime/duration)*100);
  $("progressBar").style.width=p+"%"; $("percentText").textContent=p+"%";
 },30);
};

function showResult(msg){
 if(outURL) URL.revokeObjectURL(outURL); outURL=URL.createObjectURL(outBlob);
 $("beforeSize").textContent=fmt(selectedFile.size); $("afterSize").textContent=fmt(outBlob.size);
 $("resultMessage").textContent=msg;
 const ov=$("outputVideo"); ov.src=outURL; ov.classList.remove("hidden"); ov.load();
 $("resultBox").classList.remove("hidden"); $("progressBox").classList.add("hidden");
 $("compressBtn").disabled=false; $("compressBtn").textContent=`⚡ Compress Video to ${selectedSize} MB`;
 $("progressBar").style.width="100%"; $("percentText").textContent="100%";
}

$("downloadBtn").onclick=()=>{
 const a=document.createElement("a"); a.href=outURL; a.download=selectedFile.name.replace(/\.[^/.]+$/,"")+`-compressed-${selectedSize}MB.mp4`; a.click();
};
</script>
</body>
</html>
