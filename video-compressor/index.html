<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compressor - 5MB to 50MB</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] min-h-screen p-4 flex justify-center">
<div class="w-full max-w-[600px] bg-white rounded-[24px] p-5">
  
  <!-- Orange Upload Box -->
  <div id="uploadBox" class="w-full bg-[#FFE5CC] border-2 border-dashed border-[#E86A17] rounded-2xl py-10 flex flex-col items-center cursor-pointer">
    <div class="text-4xl">⬇️</div>
    <p class="font-bold text-lg mt-2">Drop video here or Click to upload</p>
    <p class="text-sm text-gray-600">Supports MP4, MOV - max 500MB</p>
    <input id="fileInput" type="file" accept="video/*" hidden>
  </div>
  <p id="fileName" class="mt-3 text-sm font-bold hidden"></p>

  <!-- Target Size Buttons -->
  <p class="text-gray-600 mt-6 mb-3">Target Size</p>
  <div class="grid grid-cols-3 gap-3">
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2" data-size="5">5MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-[#E86A17] text-white border-2 border-[#E86A17]" data-size="10">10MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2" data-size="20">20MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2" data-size="30">30MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2" data-size="40">40MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2" data-size="50">50MB</button>
  </div>

  <!-- After Result - Only after compress -->
  <div id="afterBox" class="mt-6 hidden">
    <p class="text-gray-600 mb-2">After ✅ Compression complete</p>
    <div class="bg-[#FFE5CC] border border-[#E86A17] rounded-xl p-4 flex justify-between">
      <p class="font-bold">compressed_video.mp4</p>
      <div class="text-right text-sm"><p id="resultSize" class="font-bold">10.0 MB</p><p id="savedText"></p></div>
    </div>
  </div>

  <!-- Compress / Download Button -->
  <button id="mainBtn" class="w-full mt-6 bg-[#E86A17] text-white py-4 rounded-xl font-bold text-lg">Compress Video</button>
  <p class="text-[11px] text-center text-gray-500 mt-3">100% Private - File never leaves your phone</p>
</div>

<script>
let selectedSize = 10;
let videoFile = null;
let compressedUrl = null;

document.querySelectorAll('.size-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.size-btn').forEach(b=>{b.className="size-btn py-3 rounded-xl font-bold bg-gray-100 border-2"});
    btn.className="size-btn py-3 rounded-xl font-bold bg-[#E86A17] text-white border-2 border-[#E86A17]";
    selectedSize = btn.dataset.size;
  }
});

const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
uploadBox.onclick = ()=> fileInput.click();
fileInput.onchange = (e)=> handleFile(e.target.files[0]);

function handleFile(file){
  videoFile = file;
  document.getElementById('fileName').innerText = `📄 ${file.name} - ${(file.size/1024/1024).toFixed(1)} MB`;
  document.getElementById('fileName').classList.remove('hidden');
}

document.getElementById('mainBtn').onclick = async ()=>{
  if(!videoFile){ alert('Pehle video dal bhai!'); return; }
  
  const btn = document.getElementById('mainBtn');
  if(btn.innerText.includes('Download')){
    const a = document.createElement('a');
    a.href = compressedUrl; a.download = `compressed-${selectedSize}MB.mp4`; a.click();
    return;
  }

  btn.innerText = "Compressing... (Demo 2 sec)";
  // Yaha pe asli ffmpeg.wasm ka code aayega
  // Demo ke liye abhi fake compress dikha rahe hai
  setTimeout(()=>{
    compressedUrl = URL.createObjectURL(videoFile); // Demo - asli me compressed file hogi
    document.getElementById('resultSize').innerText = `${selectedSize}.0 MB`;
    document.getElementById('savedText').innerText = `Target ${selectedSize}MB`;
    document.getElementById('afterBox').classList.remove('hidden');
    btn.innerText = "⬇️ Download Compressed Video";
    btn.classList.add('bg-green-600');
  }, 2000);
}
</script>
</body>
</html>
