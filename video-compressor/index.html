<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f97316">
<title>Video Compressor - Compress Video to 5MB, 10MB, 20MB | NEXORA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box} body{background:#09090b;font-family:Arial,sans-serif}
#dropArea.active{background:#ffedd5;border-color:#f97316}
.sz{border:1px solid #e5e7eb;background:#f9fafb;color:#444;transition:.2s}
.sz.selected{background:#f97316;color:white;border-color:#f97316}
video{background:#111}
.progress-fill{transition:width .25s}
</style>
</head>
<body class="min-h-screen px-3 py-7">
<div class="max-w-xl mx-auto">
<div class="text-center mb-6">
<div class="inline-block bg-orange-500/10 text-orange-400 px-4 py-2 rounded-full text-sm font-bold mb-3">⚡ NEXORA FREE TOOL</div>
<h1 class="text-white text-3xl font-extrabold">Video Compressor</h1>
<p class="text-gray-400 text-sm mt-2">Fast - No 30MB download - Audio Supported</p>
</div>
<div class="bg-white rounded-3xl p-4 sm:p-6 shadow-2xl">
<div id="dropArea" class="border-2 border-dashed border-orange-400 bg-orange-50 rounded-2xl p-7 text-center cursor-pointer">
<div class="text-5xl mb-3">🎬</div>
<h2 class="font-bold text-gray-800">Upload Your Video</h2>
<p class="text-sm text-gray-500 mt-2">Click or drag and drop</p>
<input id="fileInput" type="file" accept="video/*" hidden>
</div>
<div id="fileInfo" class="hidden mt-4 bg-gray-50 rounded-xl p-3">
<p id="fileName" class="font-bold text-sm break-all"></p>
<div class="flex justify-between text-xs text-gray-500 mt-2"><span>Original Size</span><b id="originalSize"></b></div>
<div class="flex justify-between text-xs text-gray-500 mt-1"><span>Duration</span><b id="durationText"></b></div>
<div class="flex justify-between text-xs text-gray-500 mt-1"><span>Resolution</span><b id="resolutionText"></b></div>
</div>
<div id="previewBox" class="hidden mt-4">
<p class="font-bold text-sm mb-2">Preview</p>
<video id="originalVideo" controls playsinline class="w-full rounded-xl max-h-64"></video>
</div>
<canvas id="canvas" class="hidden"></canvas>
<div class="mt-6">
<h2 class="font-bold text-lg">Choose Target Size</h2>
<div class="grid grid-cols-3 gap-3 mt-4">
<button class="sz selected rounded-xl py-4 font-bold text-lg" data-size="5">5 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="10">10 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="20">20 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="30">30 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="40">40 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="50">50 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="75">75 MB</button>
<button class="sz rounded-xl py-4 font-bold text-lg" data-size="100">100 MB</button>
</div>
</div>
<div id="progressBox" class="hidden mt-6">
<div class="flex justify-between text-sm mb-2"><b id="statusText">Compressing...</b><b id="percentText" class="text-orange-600">0%</b></div>
<div class="h-3 rounded-full bg-gray-200 overflow-hidden"><div id="progressBar" class="progress-fill bg-orange-500 h-full" style="width:0%"></div></div>
<p class="text-xs text-gray-500 mt-2">Keep this page open. With audio.</p>
</div>
<button id="compressBtn" class="w-full mt-6 bg-orange-500 text-white font-bold py-4 rounded-xl text-lg">⚡ Compress Video to 5 MB</button>
<div id="resultBox" class="hidden mt-6 border border-green-200 bg-green-50 rounded-2xl p-4">
<h3 class="text-green-800 font-extrabold text-xl">✓ Compression Complete!</h3>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-white rounded-xl p-3"><p class="text-xs text-gray-500">Original</p><p id="beforeSize" class="font-extrabold text-lg"></p></div>
<div class="bg-white rounded-xl p-3"><p class="text-xs text-gray-500">Final</p><p id="afterSize" class="font-extrabold text-lg text-green-700"></p></div>
</div>
<p id="resultMessage" class="text-sm text-green-800 mt-4"></p>
<video id="outputVideo" controls playsinline class="hidden w-full rounded-xl mt-4 max-h-64"></video>
<button id="downloadBtn" class="w-full mt-4 bg-green-600 text-white py-4 rounded-xl font-bold">⬇ Download Compressed Video</button>
</div>
<div id="errorBox" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-sm"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let selectedFile=null, selectedSize=5, videoDuration=0, videoWidth=0, videoHeight=0;
let outputBlob=null, outputURL=null, originalURL=null, busy=false;

function formatSize(b){return (b/1048576).toFixed(2)+" MB";}
function formatDuration(s){if(!isFinite(s)) return "Unknown"; const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m} min ${sec} sec`; }

function loadVideo(file){
 if(busy||!file) return;
 selectedFile=file;
 if(originalURL) URL.revokeObjectURL(originalURL);
 originalURL=URL.createObjectURL(file);
 const v=$("originalVideo");
 v.src=originalURL; v.muted=false;
 $("fileName").textContent=file.name; $("originalSize").textContent=formatSize(file.size);
 $("fileInfo").classList.remove("hidden"); $("previewBox").classList.remove("hidden");
 v.onloadedmetadata=()=>{videoDuration=v.duration; videoWidth=v.videoWidth; videoHeight=v.videoHeight; $("durationText").textContent=formatDuration(videoDuration); $("resolutionText").textContent=videoWidth+"x"+videoHeight;};
 v.load();
}
$("dropArea").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>loadVideo(e.target.files[0]);
["dragenter","dragover"].forEach(ev=>{$("dropArea").addEventListener(ev,e=>{e.preventDefault(); $("dropArea").classList.add("active");});});
["dragleave","drop"].forEach(ev=>{$("dropArea").addEventListener(ev,e=>{e.preventDefault(); $("dropArea").classList.remove("active");});});
$("dropArea").addEventListener("drop",e=>loadVideo(e.dataTransfer.files[0]));

document.querySelectorAll(".sz").forEach(b=>{
 b.onclick=()=>{
  if(busy) return;
  document.querySelectorAll(".sz").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected"); selectedSize=Number(b.dataset.size);
  $("compressBtn").textContent=`⚡ Compress Video to ${selectedSize} MB`;
 };
});

$("compressBtn").onclick=async()=>{
 if(busy) return;
 if(!selectedFile){$("errorBox").textContent="Upload video first"; $("errorBox").classList.remove("hidden"); return;}
 if(!isFinite(videoDuration)||videoDuration<=0){$("errorBox").textContent="Wait for preview"; $("errorBox").classList.remove("hidden"); return;}

 busy=true; $("errorBox").classList.add("hidden"); $("progressBox").classList.remove("hidden"); $("compressBtn").disabled=true;
 $("compressBtn").textContent="Compressing..."; $("resultBox").classList.add("hidden");

 const v=$("originalVideo"), c=$("canvas"), ctx=c.getContext("2d");
 await new Promise(r=>{if(v.readyState>=1) r(); else v.onloadedmetadata=r;});

 // === FIX: EXACT TARGET SIZE - Jitna manga utna hi banega ===
 const targetBytes = selectedSize * 1024 * 1024;
 const audioBps = 128000;
 let totalBps = (targetBytes * 8) / videoDuration;
 let videoBps = Math.floor((totalBps * 0.90) - audioBps);
 if(videoBps < 500000) videoBps = 500000;
 if(videoBps > 10000000) videoBps = 10000000;

 // Scale - target ke hisab se, taaki jyada chota na ho
 let scale;
 if(selectedSize <= 5){ scale = videoDuration < 15 ? 0.9 : 0.75; }
 else if(selectedSize <= 10){ scale = 0.9; }
 else if(selectedSize <= 20){ scale = 0.95; }
 else{ scale = 1.0; }

 c.width=videoWidth*scale; c.height=videoHeight*scale;

 // === AUDIO FIX - FINAL ===
 const canvasStream=c.captureStream(30);
 const videoTrack=canvasStream.getVideoTracks()[0];
 let audioTrack=null;
 let audioCtx=null;

 try{
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   const source=audioCtx.createMediaElementSource(v);
   const dest=audioCtx.createMediaStreamDestination();
   source.connect(dest);
   try{source.connect(audioCtx.destination);}catch(e){}
   if(dest.stream.getAudioTracks().length>0){
     audioTrack=dest.stream.getAudioTracks()[0];
   }
 }catch(e){
   try{
     const tmp=v.captureStream ? v.captureStream() : v.mozCaptureStream();
     if(tmp.getAudioTracks().length>0) audioTrack=tmp.getAudioTracks()[0];
   }catch(e2){}
 }

 const mixed=new MediaStream();
 mixed.addTrack(videoTrack);
 if(audioTrack) mixed.addTrack(audioTrack);

 const mime=MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') ? 'video/mp4;codecs=avc1' : 'video/mp4';
 const rec=new MediaRecorder(mixed,{mimeType:mime, videoBitsPerSecond:videoBps});
 let chunks=[];
 rec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
 rec.onstop=()=>{
   outputBlob=new Blob(chunks,{type:"video/mp4"});
   if(outputURL) URL.revokeObjectURL(outputURL);
   outputURL=URL.createObjectURL(outputBlob);
   $("beforeSize").textContent=formatSize(selectedFile.size);
   $("afterSize").textContent=formatSize(outputBlob.size);
   $("resultMessage").textContent=`Original ${formatSize(selectedFile.size)} → ${formatSize(outputBlob.size)} | Audio: ${audioTrack?'Yes ✓':'Check volume'} | Target ${selectedSize}MB | Bitrate ${Math.round(videoBps/1000)}k`;
   $("outputVideo").src=outputURL; $("outputVideo").classList.remove("hidden"); $("outputVideo").load();
   $("resultBox").classList.remove("hidden");
   $("progressBox").classList.add("hidden");
   busy=false; $("compressBtn").disabled=false;
   $("compressBtn").textContent=`⚡ Compress Video to ${selectedSize} MB`;
   if(audioCtx) audioCtx.close();
 };

 v.currentTime=0; v.muted=false; v.volume=1;
 try{await v.play();}catch(e){}
 rec.start(100);

 const iv=setInterval(()=>{
   if(v.ended || v.paused || v.currentTime>=videoDuration){
     clearInterval(iv); rec.stop(); v.pause(); return;
   }
   ctx.drawImage(v,0,0,c.width,c.height);
   const p=Math.round((v.currentTime/videoDuration)*100);
   $("progressBar").style.width=p+"%"; $("percentText").textContent=p+"%"; $("statusText").textContent=`Compressing to ${selectedSize}MB - ${p}%`;
 },33);
};

$("downloadBtn").onclick=()=>{
 if(!outputBlob) return;
 const a=document.createElement("a"); a.href=outputURL;
 a.download=selectedFile.name.replace(/\.[^/.]+$/,"")+`-compressed-${selectedSize}MB.mp4`;
 a.click();
};
</script>
</body>
</html>
