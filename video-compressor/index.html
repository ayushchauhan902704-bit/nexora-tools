<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Compressor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body class="bg-[#121212] min-h-screen p-4 flex justify-center">
<div class="w-full max-w-[600px] bg-white rounded-[24px] p-5">
  <div id="uploadBox" class="w-full bg-[#FFE5CC] border-2 border-dashed border-[#E86A17] rounded-2xl py-10 flex flex-col items-center cursor-pointer">
    <p class="font-bold">Drop video here or Click to upload</p>
    <input id="fileInput" type="file" accept="video/*" hidden>
  </div>
  <p id="fileName" class="mt-3 text-sm font-bold hidden"></p>
  <p class="text-gray-600 mt-6 mb-3">Target Size</p>
  <div class="grid grid-cols-3 gap-3">
    <button class="size-btn py-3 rounded-xl font-bold bg-[#E86A17] text-white" data-size="5">5MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100" data-size="10">10MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100" data-size="20">20MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100" data-size="30">30MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100" data-size="40">40MB</button>
    <button class="size-btn py-3 rounded-xl font-bold bg-gray-100" data-size="50">50MB</button>
  </div>
  <video id="preview" class="hidden w-full mt-4 rounded-xl" controls></video>
  <div id="progress" class="hidden mt-4"><div class="w-full bg-gray-200 h-2 rounded"><div id="bar" class="bg-[#E86A17] h-2 rounded" style="width:0%"></div></div><p id="pText" class="text-center text-sm mt-1">0%</p></div>
  <button id="mainBtn" class="w-full mt-6 bg-[#E86A17] text-white py-4 rounded-xl font-bold">Compress Video</button>
</div>

<script>
const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;
let ffmpeg = null;
let selectedSize = 5;
let videoFile = null;
let duration = 0;
let outUrl = null;

document.querySelectorAll('.size-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.size-btn').forEach(b=>b.className="size-btn py-3 rounded-xl font-bold bg-gray-100");
    btn.className="size-btn py-3 rounded-xl font-bold bg-[#E86A17] text-white"; selectedSize=parseInt(btn.dataset.size);
  }
});

const uploadBox=document.getElementById('uploadBox'), fileInput=document.getElementById('fileInput');
uploadBox.onclick=()=>fileInput.click();
fileInput.onchange=e=>loadFile(e.target.files[0]);

function loadFile(f){
  videoFile=f;
  document.getElementById('fileName').innerText=`📄 ${f.name} - ${(f.size/1024/1024).toFixed(1)} MB`;
  document.getElementById('fileName').classList.remove('hidden');
  const v=document.getElementById('preview');
  v.src=URL.createObjectURL(f); v.classList.remove('hidden');
  v.onloadedmetadata=()=>{ duration=v.duration; }
}

document.getElementById('mainBtn').onclick=async()=>{
  const btn=document.getElementById('mainBtn');
  if(btn.innerText.includes('Download')){
    const a=document.createElement('a'); a.href=outUrl; a.download=`compressed-${selectedSize}MB.mp4`; a.click(); return;
  }
  if(!videoFile){ alert('Video select kar pehle!'); return; }
  
  btn.disabled=true; btn.innerText="Loading FFmpeg...";
  document.getElementById('progress').classList.remove('hidden');
  
  if(!ffmpeg){ ffmpeg=new FFmpeg(); await ffmpeg.load(); }
  
  ffmpeg.on('progress',({progress})=>{
    document.getElementById('bar').style.width=`${Math.round(progress*100)}%`;
    document.getElementById('pText').innerText=`Compressing ${Math.round(progress*100)}%`;
  });

  // Bitrate Formula: (Target MB * 8192) / duration - audio bitrate
  const targetKbits = (selectedSize * 8192) / (duration || 60);
  const videoKbits = Math.max(200, targetKbits - 128);

  await ffmpeg.writeFile('input.mp4', await fetchFile(videoFile));
  await ffmpeg.exec(['-i','input.mp4','-b:v',`${videoKbits}k`,'-b:a','128k','-vf','scale=-2:720','output.mp4']);
  
  const data=await ffmpeg.readFile('output.mp4');
  const blob=new Blob([data.buffer],{type:'video/mp4'});
  outUrl=URL.createObjectURL(blob);
  
  document.getElementById('pText').innerText=`Done! Final: ${(blob.size/1024/1024).toFixed(1)} MB`;
  btn.disabled=false; btn.innerText="⬇️ Download Compressed Video"; btn.className="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold";
}
</script>
</body>
</html>
