<title>Unit Converter – Length, Weight, Temperature | NEXORA</title><meta name="description" content="Free Unit Converter – Convert length, weight, temperature instantly. km to miles, kg to lbs, C to F."><link rel="canonical" href="https://nexora-tools-drab.vercel.app/unit-converter.html"><meta name="theme-color" content="#6c5ce7">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:#f7f8fc;color:#171725;line-height:1.6}a{color:inherit;text-decoration:none}.container{width:min(900px,calc(100% - 32px));margin:auto}header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid #e8e8ef}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900}.logo span{color:#6c5ce7}.card{background:white;border:1px solid #e8e8ef;border-radius:18px;padding:28px;margin:18px 0}input,select,button{width:100%;padding:14px;border:1px solid #dedee8;border-radius:12px;margin-top:8px}button{background:#6c5ce7;color:white;font-weight:700;border:0;margin-top:12px}.result{background:#f0efff;border-radius:12px;padding:16px;margin-top:14px;font-weight:700;text-align:center}footer{border-top:1px solid #e8e8ef;padding:30px 0;background:white;color:#747486;font-size:13px;margin-top:40px}.footer-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}</style></head><body>
<header><div class="container nav"><a href="/" class="logo">NEX<span>ORA</span></a><a href="/">← All Tools</a></div></header>
<main class="container"><div class="card"><h1>Unit Converter</h1><select id="type" onchange="updateUnits()"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="val1" type="number" placeholder="1" oninput="convert()"><select id="unit1"></select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><input id="val2" type="number" readonly><select id="unit2" onchange="convert()"></select></div></div></main>
<footer><div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px"><div><b>NEXORA</b><div class="footer-links"><a href="/">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="disclaimer.html">Disclaimer</a><a href="sitemap.xml">Sitemap</a></div></div><div>© 2026 NEXORA</div></div></footer>
<script>
const units={length:{km:1,m:1000,mile:0.621371}, weight:{kg:1,lb:2.20462,g:1000}, temp:{C:'C',F:'F'}};
function updateUnits(){let t=type.value, u1=unit1, u2=unit2; u1.innerHTML=''; u2.innerHTML=''; Object.keys(units[t]).forEach(k=>{u1.innerHTML+=`<option>${k}</option>`; u2.innerHTML+=`<option>${k}</option>`}); if(t!=='temp'){u2.selectedIndex=1} convert()}
function convert(){let t=type.value, v=parseFloat(val1.value); if(isNaN(v))return; if(t==='length'){let base=v/units.length[unit1.value]; val2.value=(base*units.length[unit2.value]).toFixed(4)}else if(t==='weight'){let base=v/units.weight[unit1.value]; val2.value=(base*units.weight[unit2.value]).toFixed(4)}else if(t==='temp'){let c=unit1.value==='C'?v:(v-32)*5/9; let f=unit2.value==='C'?c:c*9/5+32; val2.value=f.toFixed(2)}}
updateUnits();
</script></body></html>
