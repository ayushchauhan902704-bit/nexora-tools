<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PDF - Free, Fast, No Watermark | NEXORA</title>
<meta name="description" content="Convert JPG to PDF free, 50 images at once, no watermark, fast and secure. Best JPG to PDF tool by NEXORA.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7fb] font-sans">
<div class="max-w-4xl mx-auto p-4 md:p-8">
  <div class="bg-white rounded-[24px] shadow-sm p-6 md:p-10">
    <h1 class="text-3xl md:text-4xl font-black">JPG to PDF - Best Tool</h1>
    <p class="text-gray-500 mt-2">50 photos tak ek sath, drag & drop, no watermark, 100% private</p>
    
    <div id="drop" class="mt-6 border-[3px] border-dashed border-indigo-500 rounded-[20px] p-12 text-center bg-indigo-50/30 cursor-pointer hover:bg-indigo-50 transition">
      <div class="text-5xl">📁</div>
      <p class="mt-3 font-bold text-lg">Click or Drag JPGs Here</p>
      <p class="text-sm text-gray-400">JPG, PNG, WEBP supported</p>
      <input type="file" id="file" multiple accept="image/*" hidden>
    </div>

    <div id="preview" class="grid grid-cols-3 md:grid-cols-5 gap-3 mt-6"></div>

    <div class="mt-6 flex gap-3">
      <select id="size" class="border rounded-xl p-3 flex-1"><option value="a4">A4 Size (Best for print)</option><option value="fit">Fit Image</option></select>
      <button onclick="clearAll()" class="border rounded-xl px-4">Clear</button>
    </div>

    <button onclick="makePDF()" class="w-full mt-4 bg-[#6366f1] hover:bg-[#5556e0] text-white font-bold py-4 rounded-[14px] text-lg shadow-lg">Convert to PDF & Download →</button>
    <p class="text-center text-xs text-gray-400 mt-3">Files never leave your device. 100% Secure by NEXORA.</p>
  </div>
</div>

<script>
const drop=document.getElementById('drop'), fileInput=document.getElementById('file'), preview=document.getElementById('preview');
let images=[];

drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('bg-indigo-100')};
drop.ondrop=e=>{e.preventDefault();handleFiles(e.dataTransfer.files)};

fileInput.onchange=e=>handleFiles(e.target.files);

function handleFiles(files){
  images=[...images, ...files].slice(0,50);
  render();
}
function render(){
  preview.innerHTML='';
  images.forEach((f,i)=>{
    const div=document.createElement('div');div.className='relative group';
    div.innerHTML=`<img src="${URL.createObjectURL(f)}" class="w-full h-24 object-cover rounded-xl border"><button onclick="remove(${i})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs">X</button>`;
    preview.appendChild(div);
  })
}
function remove(i){images.splice(i,1);render()}
function clearAll(){images=[];render()}

async function makePDF(){
  if(!images.length) return alert('Pehle photo select karo bhai!');
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  for(let i=0;i<images.length;i++){
    const data=await toData(images[i]);
    if(i>0) pdf.addPage();
    pdf.addImage(data,'JPEG',10,10,190,277,undefined,'FAST');
  }
  pdf.save('NEXORA-JPG-to-PDF.pdf');
}
function toData(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
</script>
</body>
</html>
