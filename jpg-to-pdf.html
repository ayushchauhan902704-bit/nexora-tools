
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PDF Converter - Free, No Watermark | NEXORA</title>
<meta name="theme-color" content="#6366f1">
<meta name="description" content="Free JPG to PDF converter. Convert up to 50 JPG, PNG and WEBP photos into PDF without a watermark.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.photo-card {
  position:relative;
  height:125px;
  overflow:hidden;
  border-radius:12px;
  border:1px solid #e5e7eb;
  background:#f3f4f6;
}
.photo-card img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.remove-btn {
  position:absolute;
  top:5px;
  right:5px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#ef4444;
  color:white;
  font-weight:bold;
}
#pdfPreview {
  display:none;
  width:100%;
  height:500px;
  border:2px solid #e5e7eb;
  border-radius:12px;
  margin-top:16px;
}
button:disabled {
  cursor:not-allowed;
}
</style>
</head>

<body class="bg-[#f6f7fb] p-3 sm:p-5 text-gray-900">

<main class="max-w-3xl mx-auto py-3 sm:py-6">
<div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-gray-200">

<div class="text-center">
<div class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full text-sm font-bold mb-4">
📄 NEXORA FREE TOOL
</div>
<h1 class="text-3xl sm:text-4xl font-black tracking-tight">
JPG to PDF Converter
</h1>
<p class="text-gray-500 mt-3">
Convert JPG, PNG and WEBP into PDF. 50 photos, no watermark.
</p>
</div>

<div id="drop" class="mt-7 border-[2px] border-dashed border-indigo-400 rounded-2xl p-8 sm:p-12 text-center bg-indigo-50 cursor-pointer">
<div class="text-5xl">📁</div>
<div class="font-extrabold text-lg mt-3">Select or Drag Photos Here</div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/*" multiple hidden>
<button type="button" id="chooseBtn" class="mt-5 bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl">
Choose Photos
</button>
</div>

<div class="flex justify-between mt-5">
<div class="font-extrabold">Your Photos</div>
<div id="count" class="text-sm text-gray-500">0 / 50 photos</div>
</div>

<div id="preview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-3"></div>
<div id="emptyMessage" class="text-center text-sm text-gray-400 py-5">
Your selected photos will appear here.
</div>

<div class="mt-5">
<label for="size" class="block font-bold text-sm mb-2">PDF Page Size</label>
<select id="size" class="w-full bg-gray-50 border border-gray-200 font-semibold py-3 px-4 rounded-xl">
<option value="a4">A4 — Standard printing size</option>
<option value="letter">US Letter — US standard</option>
<option value="fit">Fit Image — Original aspect ratio</option>
</select>
</div>

<div class="grid grid-cols-2 gap-3 mt-6">
<button type="button" id="convertBtn" class="bg-white border-2 border-indigo-600 text-indigo-600 font-extrabold py-4 rounded-xl text-base">
👁️ Convert & Preview
</button>
<button type="button" id="downloadBtn" class="bg-indigo-600 text-white font-extrabold py-4 rounded-xl text-base opacity-50" disabled>
⬇️ Download PDF
</button>
</div>

<button type="button" id="clearBtn" class="w-full mt-3 bg-gray-100 font-bold py-3 rounded-xl">
Clear All
</button>

<div id="status" role="status" aria-live="polite" class="text-center mt-4 text-sm font-bold"></div>
<iframe id="pdfPreview" title="PDF Preview"></iframe>

<p class="text-center text-xs text-gray-400 mt-5">
100% Private - Your photos never leave your phone.
</p>

</div>
</main>

<script>
(() => {
"use strict";

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const count = document.getElementById("count");
const emptyMessage = document.getElementById("emptyMessage");
const status = document.getElementById("status");
const convertBtn = document.getElementById("convertBtn");
const downloadBtn = document.getElementById("downloadBtn");
const sizeSelect = document.getElementById("size");
const pdfPreview = document.getElementById("pdfPreview");

let images = [];
let currentDoc = null;
let currentFileName = "";
let busy = false;
let previewUrl = null;

function setStatus(message, error = false) {
  status.textContent = message;
  status.className =
    "text-center mt-4 text-sm font-bold " +
    (error ? "text-red-600" : "text-indigo-600");
}

function revokePreview() {
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
  pdfPreview.removeAttribute("src");
  pdfPreview.style.display = "none";
}

function invalidatePDF() {
  currentDoc = null;
  currentFileName = "";
  downloadBtn.disabled = true;
  downloadBtn.classList.add("opacity-50");
  revokePreview();
}

function render() {
  preview.replaceChildren();
  count.textContent = `${images.length} / 50 photos`;
  emptyMessage.style.display = images.length ? "none" : "block";

  images.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = item.url;
    img.alt = `Selected photo ${index + 1}`;

    const num = document.createElement("span");
    num.textContent = index + 1;
    num.className =
      "absolute left-2 top-2 bg-black/60 text-white text-xs font-bold px-2 py-1 rounded-md";

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "remove-btn";
    remove.textContent = "×";
    remove.setAttribute("aria-label", `Remove photo ${index + 1}`);

    remove.onclick = () => {
      if (busy) return;
      images.splice(index, 1);
      invalidatePDF();
      render();
      setStatus("Photo removed.");
    };

    card.append(img, num, remove);
    preview.appendChild(card);
  });
}

function openPicker() {
  if (!busy) fileInput.click();
}

drop.addEventListener("click", event => {
  if (event.target.closest("button")) return;
  openPicker();
});

document.getElementById("chooseBtn").addEventListener("click", event => {
  event.stopPropagation();
  openPicker();
});

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Could not read the selected photo."));
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Could not open this image."));
    img.src = src;
  });
}

function fixAndCompress(img) {
  const maxSide = 2000;
  let width = img.naturalWidth;
  let height = img.naturalHeight;

  const scale = Math.min(1, maxSide / Math.max(width, height));
  width = Math.max(1, Math.round(width * scale));
  height = Math.max(1, Math.round(height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d");
  if (!context) throw new Error("Image processing is not supported.");

  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, width, height);
  context.drawImage(img, 0, 0, width, height);

  const data = canvas.toDataURL("image/jpeg", 0.85);
  return { data, width, height };
}

async function handleFiles(fileList) {
  if (busy) return;

  const available = 50 - images.length;
  const selected = Array.from(fileList || []);
  if (!selected.length) return;

  if (available <= 0) {
    setStatus("Maximum 50 photos allowed.", true);
    return;
  }

  const files = selected.slice(0, available);
  let added = 0;

  if (selected.length > available) {
    setStatus("Only the first available photos will be added.");
  } else {
    setStatus("Preparing photos...");
  }

  for (const file of files) {
    try {
      if (!file.type.startsWith("image/")) continue;

      const dataURL = await readAsDataURL(file);
      const img = await loadImage(dataURL);
      const fixed = fixAndCompress(img);

      images.push({
        url: fixed.data,
        width: fixed.width,
        height: fixed.height
      });

      added++;
    } catch (error) {
      // Skip unsupported or damaged image files.
    }
  }

  if (added > 0) invalidatePDF();

  render();

  if (added > 0) {
    setStatus(`${added} photo(s) added. Click Convert & Preview.`);
  } else {
    setStatus("No supported photos could be added.", true);
  }
}

fileInput.addEventListener("change", async () => {
  await handleFiles(fileInput.files);
  fileInput.value = "";
});

drop.addEventListener("dragover", event => {
  event.preventDefault();
});

drop.addEventListener("drop", async event => {
  event.preventDefault();
  await handleFiles(event.dataTransfer.files);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (busy) return;

  images = [];
  invalidatePDF();
  render();
  setStatus("All photos cleared.");
});

async function convertPDF() {
  if (!images.length) {
    alert("Pehle photos upload karo!");
    return;
  }

  if (busy) return;

  if (!window.jspdf || !window.jspdf.jsPDF) {
    setStatus("PDF library load nahi hui. Internet check karke page reload karo.", true);
    return;
  }

  busy = true;
  convertBtn.disabled = true;
  downloadBtn.disabled = true;
  convertBtn.textContent = "Converting...";

  invalidatePDF();

  try {
    const { jsPDF } = window.jspdf;
    const selectedSize = sizeSelect.value;
    let doc = null;

    for (let index = 0; index < images.length; index++) {
      setStatus(`Converting photo ${index + 1} of ${images.length}...`);

      const item = images[index];

      if (selectedSize === "fit") {
        const widthMM = item.width * 25.4 / 96;
        const heightMM = item.height * 25.4 / 96;
        const orientation = widthMM > heightMM ? "landscape" : "portrait";

        if (!doc) {
          doc = new jsPDF({
            orientation,
            unit: "mm",
            format: [widthMM, heightMM],
            compress: true
          });
        } else {
          doc.addPage([widthMM, heightMM], orientation);
        }

        doc.addImage(item.url, "JPEG", 0, 0, widthMM, heightMM, undefined, "FAST");
      } else {
        const format = selectedSize === "letter" ? "letter" : "a4";

        if (!doc) {
          doc = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format,
            compress: true
          });
        } else {
          doc.addPage(format, "portrait");
        }

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const maxWidth = pageWidth - 20;
        const maxHeight = pageHeight - 20;
        const ratio = Math.min(
          maxWidth / item.width,
          maxHeight / item.height
        );

        const width = item.width * ratio;
        const height = item.height * ratio;

        doc.addImage(
          item.url,
          "JPEG",
          (pageWidth - width) / 2,
          (pageHeight - height) / 2,
          width,
          height,
          undefined,
          "FAST"
        );
      }

      await new Promise(resolve => setTimeout(resolve, 0));
    }

    if (!doc) throw new Error("PDF could not be created.");

    currentDoc = doc;
    currentFileName = `NEXORA-Photos-${Date.now()}.pdf`;

    // Create a Blob URL for the preview.
    const blob = doc.output("blob");
    previewUrl = URL.createObjectURL(blob);
    pdfPreview.src = previewUrl;
    pdfPreview.style.display = "block";

    downloadBtn.disabled = false;
    downloadBtn.classList.remove("opacity-50");

    setStatus("PDF ready! Preview dekho, phir Download PDF dabao.");

  } catch (error) {
    invalidatePDF();
    setStatus(
      "PDF banane mein problem hui. Kam photos ke saath dobara try karo.",
      true
    );
  } finally {
    busy = false;
    convertBtn.disabled = false;
    convertBtn.textContent = "👁️ Convert & Preview";
  }
}

async function downloadPDF() {
  if (busy) return;

  if (!currentDoc) {
    alert("Pehle Convert & Preview par click karo!");
    return;
  }

  let blobURL = null;

  try {
    downloadBtn.disabled = true;
    downloadBtn.textContent = "Preparing PDF...";

    // Generate a real PDF Blob.
    const blob = currentDoc.output("blob");
    const fileName = currentFileName || "NEXORA-Photos.pdf";

    if (!blob || blob.size === 0) {
      throw new Error("The PDF file is empty.");
    }

    const pdfFile = new File([blob], fileName, {
      type: "application/pdf"
    });

    // iPhone/iPad: open the native share sheet when supported.
    if (
      typeof navigator.share === "function" &&
      typeof navigator.canShare === "function" &&
      navigator.canShare({ files: [pdfFile] })
    ) {
      await navigator.share({
        files: [pdfFile],
        title: "NEXORA PDF",
        text: "Your converted PDF"
      });

      setStatus("PDF ready. Sharing complete or choose Save to Files.");
      return;
    }

    // Standard download fallback for other browsers.
    blobURL = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = blobURL;
    link.download = fileName;
    link.style.display = "none";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setStatus("PDF download started. Check your Downloads folder.");

    // Delay cleanup to give mobile browsers time to start downloading.
    const urlToRevoke = blobURL;
    blobURL = null;
    setTimeout(() => URL.revokeObjectURL(urlToRevoke), 120000);

  } catch (error) {
    if (error && error.name === "AbortError") {
      setStatus("Save cancelled. Tap Download PDF to try again.");
    } else {
      // Try standard download if native sharing fails.
      try {
        const blob = currentDoc.output("blob");
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = currentFileName || "NEXORA-Photos.pdf";
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setStatus("Download requested. If it doesn't appear, use Preview and Share.");

        setTimeout(() => URL.revokeObjectURL(url), 120000);
      } catch (fallbackError) {
        setStatus("Download failed. Please try again.", true);
      }
    }
  } finally {
    if (blobURL) URL.revokeObjectURL(blobURL);

    downloadBtn.disabled = !currentDoc;
    downloadBtn.textContent = "⬇️ Download PDF";
  }
}

convertBtn.addEventListener("click", convertPDF);
downloadBtn.addEventListener("click", downloadPDF);

window.addEventListener("pagehide", () => {
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
});

})();
</script>

</body>
</html>
