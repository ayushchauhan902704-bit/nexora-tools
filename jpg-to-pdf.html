<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PDF - Best Tool | 50 Photos, No Watermark | NEXORA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7fb] p-4">
<div class="max-w-3xl mx-auto">
<div class="bg-white rounded-[24px] p-6 md:p-8 shadow-sm border">
<h1 class="text-3xl font-black text-center">JPG to PDF - Best Tool</h1>
<p class="text-center text-gray-500 mt-1 font-semibold">50 photos tak ek sath, drag & drop, no watermark, 100% private</p>

<div id="drop" class="mt-6 border-[3px] border-dashed border-[#6366f1] rounded-[20px] p-12 text-center bg-[#6366f1]/5 cursor-pointer">
<div class="text-4xl">📁</div>
<div class="font-black text-lg mt-2">Click or Drag JPGs Here</div>
<div class="text-sm text-gray-400 font-semibold">JPG, PNG, WEBP supported</div>
<input type="file" id="file" accept="image/*" multiple hidden>
</div>

<div id="preview" class="grid grid-cols-3 gap-3 mt-6"></div>

<div class="flex gap-3 mt-6">
<select id="size" class="flex-1 bg-gray-100 border font-bold py-3 px-4 rounded-[12px]">
<option value="a4">A4 Size (Best for print)</option>
<option value="fit">Fit Image (No Margin)</option>
<option value="letter">Letter Size</option>
</select>
<button onclick="clearAll()" class="bg-white border font-bold px-6 rounded-[12px]">Clear</button>
</div>

<button onclick="downloadPDF()" id="btn" class="w-full mt-4 bg-[#6366f1] text-white font-black py-4 rounded-[14px] text-lg">Convert to PDF & Download →</button>
<p class="text-center text-[11px] text-gray-400 mt-3 font-bold">Files never leave your device. 100% Secure by NEXORA.</p>
<p id="status" class="text-center mt-3 font-bold text-[#6366f1]"></p>
</div>
</div>

<script>
let images=[];
const drop=document.getElementById('drop'), file=document.getElementById('file'), preview=document.getElementById('preview'), status=document.getElementById('status');

drop.onclick=()=>file.click();
drop.ondragover=(e)=>{e.preventDefault(); drop.classList.add('bg-indigo-100')};
drop.ondragleave=()=>drop.classList.remove('bg-indigo-100');
drop.ondrop=(e)=>{e.preventDefault(); drop.classList.remove('bg-indigo-100'); handleFiles(e.dataTransfer.files)};

file.onchange=(e)=>handleFiles(e.target.files);

function handleFiles(files){
 for(let f of files){
   if(images.length>=50) break;
   let reader=new FileReader();
   reader.onload=(ev)=>{
     images.push(ev.target.result);
     render();
   };
   reader.readAsDataURL(f);
 }
}

function render(){
 preview.innerHTML='';
 images.forEach((src,i)=>{
   preview.innerHTML+=`<div class="relative border rounded-[12px] overflow-hidden h-[110px]"><img src="${src}" class="w-full h-full object-cover"><button onclick="removeImg(${i})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full font-black text-xs">X</button></div>`;
 });
 status.textContent=`${images.length} Images Ready`;
}

function removeImg(i){ images.splice(i,1); render(); }
function clearAll(){ images=[]; render(); status.textContent=''; }

async function downloadPDF(){
 if(images.length==0) return alert('Pehle photo daal bhai!');
 const { jsPDF } = window.jspdf;
 let size=document.getElementById('size').value;
 let doc;
 if(size=='a4') doc=new jsPDF('p','mm','a4');
 else if(size=='letter') doc=new jsPDF('p','mm','letter');
 else doc=new jsPDF('p','mm',[210,297]);

 status.textContent='Bana raha hu PDF... please wait';

 for(let i=0;i<images.length;i++){
   if(i>0) doc.addPage();
   let img=images[i];
   if(size=='fit'){
     let props=doc.getImageProperties(img);
     let pdfW=doc.internal.pageSize.getWidth();
     let pdfH=(props.height*pdfW)/props.width;
     doc.addImage(img,'JPEG',0,0,pdfW,pdfH);
   } else {
     doc.addImage(img,'JPEG',10,10,190,270, undefined, 'FAST');
   }
 }
 doc.save(`NEXORA-JPG-to-PDF-${Date.now()}.pdf`);
 status.textContent='✅ Download Ho Gaya!';
}
</script>
</body>
</html>
