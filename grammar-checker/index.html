<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Checker - Auto Correct | NEXORA Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f8fafc}
.nav{padding:14px 5%;background:white;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;font-weight:800}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:white;border-radius:20px;padding:20px;border:1px solid #e2e8f0;margin-top:16px}
textarea{width:100%;min-height:160px;padding:16px;border:1px solid #e2e8f0;border-radius:14px;font-size:16px;outline:none}
textarea:focus{border-color:#2563eb}
.btn{padding:14px 22px;border-radius:12px;border:none;background:#0f172a;color:white;font-weight:800;cursor:pointer;width:100%;margin-top:12px;font-size:15px}
.btn:hover{background:#2563eb}
.corrected-box{background:#f0fdf4;border:2px solid #22c55e;border-radius:16px;padding:18px;margin-top:16px;min-height:120px;font-size:16px;line-height:1.6;white-space:pre-wrap}
.label{font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:8px;display:block}
.footer-min{margin-top:40px;background:#f5f5f7;border-top:1px solid rgba(0,0,0,0.1);padding:20px 5%;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="nav"><div>🧮 NEXORA Tools</div><div style="font-size:11px;opacity:0.6">SIMPLE • FAST</div></div>
<div class="container">
  <h1 style="text-align:center;font-weight:900;font-size:28px;margin-top:20px">Grammar Checker <span style="color:#2563eb">Auto Fix</span></h1>
  <p style="text-align:center;color:#64748b;font-size:13px;margin-top:6px">Galat likho, sahi pao - ek click me</p>

  <div class="card">
    <span class="label">❌ GALAT TEXT YAHAN LIKHO:</span>
    <textarea id="wrong" placeholder="Example: I has a apple. She dont like to goes to market. This are my best friend and its very good."></textarea>
    <button class="btn" onclick="fixGrammar()">✨ Sahi Karke Do →</button>
    
    <span class="label" style="margin-top:20px;color:#16a34a">✅ SAHI TEXT (Auto Corrected):</span>
    <div id="right" class="corrected-box">Yahan sahi text ayega...</div>
    
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn" style="background:#22c55e" onclick="copyRight()">📋 Copy Sahi Text</button>
      <button class="btn" style="background:#f1f5f9;color:black" onclick="clearAll()">Clear</button>
    </div>
  </div>
</div>

<footer class="footer-min"><div style="font-size:13px;color:rgba(0,0,0,0.4)">Copyright © NEXORA Tools 2026</div><button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="background:#1a1a1a;color:white;width:50px;height:50px;border:none">↑</button></footer>

<script>
async function fixGrammar(){
  const wrong=document.getElementById('wrong').value.trim();
  const rightBox=document.getElementById('right');
  if(!wrong){alert('Pehle kuch likho!');return;}
  rightBox.textContent='Sahi kar raha hu...';
  try{
    const fd=new FormData();fd.append('text',wrong);fd.append('language','en-US');
    const res=await fetch('https://api.languagetool.org/v2/check',{method:'POST',body:fd});
    const data=await res.json();
    let fixed=wrong;
    // Reverse loop to fix offsets
    const matches=data.matches.sort((a,b)=>b.offset-a.offset);
    matches.forEach(m=>{
      const rep=m.replacements[0]?.value;
      if(rep){fixed=fixed.substring(0,m.offset)+rep+fixed.substring(m.offset+m.length);}
    });
    // Extra basic fixes
    fixed=fixed.replace(/\bI has\b/gi,'I have').replace(/\bShe dont\b/gi,"She doesn't").replace(/\bThis are\b/gi,'These are').replace(/\bTeh\b/g,'The').replace(/\bteh\b/g,'the').replace(/\bdont\b/gi,"don't").replace(/\bI has a apple\b/gi,'I have an apple');
    rightBox.textContent=fixed;
  }catch(e){
    // Offline simple fix
    let fixed=wrong.replace(/\bI has\b/gi,'I have').replace(/\bShe dont\b/gi,"She doesn't").replace(/\bThis are\b/gi,'These are').replace(/\bTeh\b/g,'The').replace(/\bteh\b/g,'the').replace(/\bdont\b/gi,"don't").replace(/\bMe and him is\b/gi,'He and I are');
    rightBox.textContent=fixed+'\n\n(Offline fixed)';
  }
}
function copyRight(){navigator.clipboard.writeText(document.getElementById('right').textContent);alert('Sahi text copy ho gaya!');}
function clearAll(){document.getElementById('wrong').value='';document.getElementById('right').textContent='Yahan sahi text ayega...';}
</script>
</body>
</html>
