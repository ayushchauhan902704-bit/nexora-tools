<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Text Humanizer - Humanize AI Text Free | Nexora Tools</title>
<meta name="description" content="Free AI Text Humanizer - Convert AI text to 100% human-like text. Bypass AI detectors. No signup.">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f8fafc;padding:15px}
.container{max-width:900px;margin:auto;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}
.header{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:25px;text-align:center}
.tool-box{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:768px){.tool-box{grid-template-columns:1fr}}
textarea{width:100%;height:340px;border:2px solid #e2e8f0;border-radius:12px;padding:14px;font-size:15px;outline:none;resize:none}
textarea:focus{border-color:#7c3aed}
.controls{padding:0 20px 20px;display:flex;gap:10px;flex-wrap:wrap}
select{padding:12px;border-radius:10px;border:2px solid #e2e8f0}
.btn-main{flex:1;min-width:200px;background:#7c3aed;color:#fff;padding:13px;border:none;border-radius:10px;font-weight:700;font-size:16px}
.badge{background:#f1f5f9;padding:5px 10px;border-radius:20px;font-size:12px;color:#475569}
.stats{padding:15px 20px 0;display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>AI Text Humanizer</h1><p>Make AI Text 100% Human & Undetectable</p></div>
<div class="stats">
<span class="badge" id="wIn">0 Words In</span>
<span class="badge" id="wOut">0 Words Out</span>
<span class="badge" style="background:#dcfce7;color:#166534;">✓ Bypass AI Detector</span>
</div>
<div class="tool-box">
<div><label style="font-weight:700;display:block;margin-bottom:6px;">AI Text</label><textarea id="inT" placeholder="Paste ChatGPT text here..."></textarea></div>
<div><label style="font-weight:700;display:block;margin-bottom:6px;">Humanized Result</label><textarea id="outT" placeholder="Result here..." readonly></textarea></div>
</div>
<div class="controls">
<select id="mode"><option value="student">Student Mode</option><option value="casual">Casual Human (Best)</option><option value="pro">Professional</option></select>
<button class="btn-main" onclick="humanize()">Humanize Now →</button>
<button onclick="copyT()" style="padding:12px 18px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;">Copy</button>
</div>
</div>
<script>
function humanize(){
let t=document.getElementById('inT').value.trim();
if(!t){alert('Pehle text daal!');return}
let syn={"utilize":"use","however":"but","moreover":"also","therefore":"so","in order to":"to","a large number of":"many","it is important to note":"note that","comprehensive":"full","facilitate":"help"};
for(let k in syn){let r=new RegExp('\\b'+k+'\\b','gi');t=t.replace(r,syn[k])}
t=t.replace(/\bIt is\b/g,"It's").replace(/\bI am\b/g,"I'm").replace(/\bDo not\b/g,"Don't").replace(/\bCannot\b/g,"Can't");
let s=t.split('. ');let mode=document.getElementById('mode').value;
let res=s.map((x,i)=>{x=x.trim();if(mode=='casual'&&i%2==0&&x.length>25&&Math.random()>0.5){x+=' you know'}return x}).join('. ');
document.getElementById('outT').value=res;
document.getElementById('wOut').innerText=res.split(/\s+/).filter(w=>w).length+' Words Out';
}
document.getElementById('inT').addEventListener('input',e=>{
document.getElementById('wIn').innerText=e.target.value.split(/\s+/).filter(w=>w).length+' Words In';
});
function copyT(){let o=document.getElementById('outT');o.select();document.execCommand('copy');alert('Copied!')}
</script>
</body>
</html>
