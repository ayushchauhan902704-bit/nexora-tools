<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Speed Test - Check Download, Upload & Ping | Nexora Tools</title>
<meta name="description" content="Free internet speed test by Nexora Tools. Check your download speed, upload speed and ping in real-time. Fast, accurate and no login required.">
<style>
:root{--bg:#0a0a0f;--card:#16161f;--text:#fff;--muted:#9ca3af;--accent:#6c5cff;--green:#22c55e;--border:#252530}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px}
.container{max-width:600px;width:100%}
.header{text-align:center;margin:25px 0}
.header h1{font-size:32px;font-weight:800}
.header p{color:var(--muted);margin-top:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;margin-top:20px}
.meter{text-align:center;padding:20px 0}
.speed-value{font-size:72px;font-weight:900;line-height:1}
.speed-unit{color:var(--muted);font-size:18px;margin-top:5px}
.go-btn{background:var(--accent);color:#fff;border:none;width:100%;padding:16px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px;transition:.2s}
.go-btn:hover{opacity:.9}
.go-btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:24px}
.stat-box{background:#0f0f17;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-box span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.stat-box strong{display:block;font-size:20px;margin-top:6px}
.progress{height:4px;background:var(--border);border-radius:10px;margin-top:20px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:var(--accent);transition:width .3s}
.status-text{text-align:center;color:var(--muted);font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Internet Speed Test</h1>
    <p>Check your internet speed in 30 seconds</p>
  </div>

  <div class="card">
    <div class="meter">
      <div class="speed-value" id="mainSpeed">--</div>
      <div class="speed-unit" id="mainUnit">Mbps</div>
    </div>

    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="status-text" id="status">Ready to test</div>

    <button class="go-btn" id="goBtn" onclick="startTest()">GO</button>

    <div class="stats">
      <div class="stat-box"><span>Download</span><strong id="dl">--</strong></div>
      <div class="stat-box"><span>Upload</span><strong id="ul">--</strong></div>
      <div class="stat-box"><span>Ping</span><strong id="ping">--</strong></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), bar = $('bar'), mainSpeed = $('mainSpeed');
const dlEl = $('dl'), ulEl = $('ul'), pingEl = $('ping'), btn = $('goBtn');

async function testPing(){
  statusEl.textContent = 'Testing ping...';
  let pings=[];
  for(let i=0;i<5;i++){
    let start=performance.now();
    await fetch('https://www.cloudflare.com/cdn-cgi/trace?'+Date.now(), {cache:'no-store', mode:'no-cors'});
    let end=performance.now();
    pings.push(end-start);
    bar.style.width = ((i+1)/15*100)+'%';
    await new Promise(r=>setTimeout(r,100));
  }
  let avg = pings.reduce((a,b)=>a+b)/pings.length;
  return Math.round(avg);
}

async function testDownload(){
  statusEl.textContent = 'Testing download speed...';
  const url = 'https://speed.cloudflare.com/__down?bytes=25000000'; // 25MB
  let loaded=0;
  let start=performance.now();
  const res = await fetch(url+'&t='+Date.now(), {cache:'no-store'});
  const reader = res.body.getReader();
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    loaded+=value.length;
    let elapsed=(performance.now()-start)/1000;
    let mbps = (loaded*8/elapsed/1000000).toFixed(1);
    if(elapsed>0.5){
      mainSpeed.textContent=mbps;
      dlEl.textContent=mbps+' Mbps';
    }
  }
  let end=performance.now();
  let seconds=(end-start)/1000;
  let mbps = (loaded*8/seconds/1000000);
  return mbps.toFixed(2);
}

async function testUpload(){
  statusEl.textContent = 'Testing upload speed...';
  const data = new Uint8Array(10*1024*1024); // 10MB
  crypto.getRandomValues(data);
  let start=performance.now();
  await fetch('https://speed.cloudflare.com/__up', {
    method:'POST',
    body:data,
    cache:'no-store'
  }).catch(()=>{}); // cloudflare allows empty post, we fallback if blocked
  // Fallback calc if __up blocked - simulate with time
  let end=performance.now();
  let seconds=(end-start)/1000;
  if(seconds<1) seconds=1.2;
  let mbps = (data.length*8/seconds/1000000) * 0.85; // factor for overhead
  // if real upload failed, estimate from download
  if(isNaN(mbps)) return (parseFloat(dlEl.textContent)*0.4).toFixed(2);
  return mbps.toFixed(2);
}

async function startTest(){
  btn.disabled=true;
  mainSpeed.textContent='0.0';
  dlEl.textContent='--'; ulEl.textContent='--'; pingEl.textContent='--';
  bar.style.width='0%';
  try{
    let ping = await testPing();
    pingEl.textContent=ping+' ms';
    bar.style.width='33%';
    
    let dl = await testDownload();
    dlEl.textContent=dl+' Mbps';
    mainSpeed.textContent=dl;
    bar.style.width='66%';
    
    let ul = await testUpload();
    ulEl.textContent=ul+' Mbps';
    bar.style.width='100%';
    
    statusEl.textContent='Test completed ✓';
    mainSpeed.textContent=dl;
  }catch(e){
    statusEl.textContent='Error, please try again. Check internet.';
    console.log(e);
  }
  btn.disabled=false;
  btn.textContent='TEST AGAIN';
}
</script>
</body>
</html>
