<script>function calcDiff(){let a=new Date(d1.value), b=new Date(d2.value); if(!d1.value||!d2.value)return alert('Select dates'); let diff=Math.abs(b-a); let days=Math.floor(diff/86400000); let months=Math.floor(days/30.44); let years=Math.floor(days/365.25); res.style.display='block'; res.innerHTML=`${days} Days<br><span style="font-weight:400;font-size:13px">~ ${months} Months | ~ ${years} Years</span>`}</script></body></html>
